apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: league-draft
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - league-draft.gaimplan.com
      secretName: league-draft-tls
  rules:
    - host: league-draft.gaimplan.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: league-draft
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: league-draft
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: league-draft
                port:
                  number: 80
