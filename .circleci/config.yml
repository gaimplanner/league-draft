version: 2.1

orbs:
  python: circleci/python@2.1
  node: circleci/node@5.1
  docker: circleci/docker@2.4

executors:
  python-executor:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/project

  python-with-postgres:
    docker:
      - image: cimg/python:3.13
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: league_draft
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: league_draft_test
    working_directory: ~/project

  node-executor:
    docker:
      - image: cimg/node:20.14
    working_directory: ~/project

jobs:
  # Install dependencies for frontend
  install-frontend:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-deps-v1-{{ checksum "package-lock.json" }}
            - frontend-deps-v1-
      - run:
          name: Install frontend dependencies
          command: npm ci
      - save_cache:
          key: frontend-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  # Install dependencies for server
  install-server:
    executor: python-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - server-deps-v1-{{ checksum "server/requirements.txt" }}
            - server-deps-v1-
      - run:
          name: Install server dependencies
          command: |
            cd server
            python -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: server-deps-v1-{{ checksum "server/requirements.txt" }}
          paths:
            - server/venv
      - persist_to_workspace:
          root: .
          paths:
            - server/venv

  # Lint and type-check frontend
  lint-frontend:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Lint frontend
          command: npm run lint
      - run:
          name: Type check frontend
          command: npx tsc --noEmit

  # Lint server
  lint-server:
    executor: python-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Check Django configuration
          command: |
            cd server
            . venv/bin/activate
            python manage.py check

  # Build frontend
  build-frontend:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build frontend
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Test server
  test-server:
    executor: python-with-postgres
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              nc -z localhost 5432 && break
              echo "Waiting for Postgres..."
              sleep 1
            done
      - run:
          name: Run migrations
          command: |
            cd server
            . venv/bin/activate
            export DATABASE_URL=postgresql://league_draft:test_password@localhost:5432/league_draft_test
            python manage.py migrate
      - run:
          name: Run tests
          command: |
            cd server
            . venv/bin/activate
            export DATABASE_URL=postgresql://league_draft:test_password@localhost:5432/league_draft_test
            python manage.py test

  # Run E2E tests
  test-e2e:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Run E2E tests
          command: npm run test:e2e
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

  # Build and push Docker image
  build-docker:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - docker/check:
          docker-username: _json_key
          docker-password: GCLOUD_SERVICE_KEY
          registry: us-east1-docker.pkg.dev
      - run:
          name: Build Docker image
          command: |
            docker build \
              --target production \
              -t us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:${CIRCLE_SHA1} \
              -t us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:latest \
              .
      - run:
          name: Push Docker image
          command: |
            docker push us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:${CIRCLE_SHA1}
            docker push us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:latest

  # Deploy to staging
  deploy-staging:
    docker:
      - image: google/cloud-sdk:alpine
    steps:
      - checkout
      - run:
          name: Authenticate with GCP
          command: |
            echo ${GCLOUD_SERVICE_KEY} | gcloud auth activate-service-account --key-file=-
            gcloud config set project gaimplan-core
            gcloud config set compute/zone us-east1-b
            gcloud container clusters get-credentials staging-cluster --zone us-east1-b
      - run:
          name: Deploy to Kubernetes
          command: |
            kubectl set image deployment/league-draft \
              league-draft=us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:${CIRCLE_SHA1} \
              -n staging
            kubectl rollout status deployment/league-draft -n staging

  # Deploy to production
  deploy-production:
    docker:
      - image: google/cloud-sdk:alpine
    steps:
      - checkout
      - run:
          name: Authenticate with GCP
          command: |
            echo ${GCLOUD_SERVICE_KEY} | gcloud auth activate-service-account --key-file=-
            gcloud config set project gaimplan-core
            gcloud config set compute/zone us-east1-b
            gcloud container clusters get-credentials production-cluster --zone us-east1-b
      - run:
          name: Deploy to Kubernetes
          command: |
            kubectl set image deployment/league-draft \
              league-draft=us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:${CIRCLE_SHA1} \
              -n production
            kubectl rollout status deployment/league-draft -n production

workflows:
  version: 2

  build-test-deploy:
    jobs:
      # Install dependencies in parallel
      - install-frontend
      - install-server

      # Lint in parallel after install
      - lint-frontend:
          requires:
            - install-frontend
      - lint-server:
          requires:
            - install-server

      # Build and test in parallel after lint
      - build-frontend:
          requires:
            - lint-frontend
      - test-server:
          requires:
            - lint-server

      # E2E tests after frontend build
      - test-e2e:
          requires:
            - build-frontend

      # Build Docker after all builds and tests pass
      - build-docker:
          requires:
            - build-frontend
            - test-server
            - test-e2e
          filters:
            branches:
              only:
                - main
                - staging

      # Deploy to staging on staging branch
      - deploy-staging:
          requires:
            - build-docker
          filters:
            branches:
              only: staging

      # Deploy to production on main branch (requires approval)
      - hold-production:
          type: approval
          requires:
            - build-docker
          filters:
            branches:
              only: main

      - deploy-production:
          requires:
            - hold-production
          filters:
            branches:
              only: main
