services:
  db:
    image: postgres:16-alpine
    container_name: league-draft-db
    environment:
      POSTGRES_USER: league_draft
      POSTGRES_PASSWORD: league_draft_dev
      POSTGRES_DB: league_draft
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_draft -d league_draft"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: league-draft-api
    environment:
      DATABASE_URL: postgresql://league_draft:league_draft_dev@db:5432/league_draft
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
    ports:
      - "3001:8000"
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
